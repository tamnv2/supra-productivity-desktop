name: Release Windows Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual prerelease build, e.g. v1.4.0-test.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate repository
        run: |
          python scripts/validate_project_state.py
          python scripts/validate_public_repo.py
          go test ./internal/core

      - name: Build Windows x64
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath \
            -ldflags="-s -w -H=windowsgui -X main.appVersion=${VERSION}" \
            -o dist/SupraProductivity.exe ./cmd/supra-productivity
          python scripts/scan_binary.py dist/SupraProductivity.exe
          cd dist
          sha256sum SupraProductivity.exe > SHA256SUMS.txt
          zip -9 "SupraProductivity_${VERSION}_windows_x64.zip" SupraProductivity.exe SHA256SUMS.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="dist/SupraProductivity_${VERSION}_windows_x64.zip"
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/SupraProductivity.exe dist/SHA256SUMS.txt "$ASSET" --clobber
          else
            gh release create "$VERSION" \
              dist/SupraProductivity.exe \
              dist/SHA256SUMS.txt \
              "$ASSET" \
              --title "SUPRA PRODUCTIVITY $VERSION" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi
